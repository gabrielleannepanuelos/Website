<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabrielle Anne | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 0.25rem;
    }
  </style>
</head>
<body class="text-gray-800 relative min-h-screen bg-gray-50">

  <!-- Fixed background image layer with low opacity -->
  <div 
    class="fixed inset-0 pointer-events-none" 
    style="
      background-image: url('images/trees1.JPG');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.22;
      z-index: 0;
    ">
  </div>

  <div class="relative z-10 flex flex-col min-h-screen">
    <header class="bg-white shadow p-6">
      <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-4xl font-bold">Gabrielle Anne</h1>
        <nav class="space-x-4">
          <a href="#" class="hover:underline">Home</a>
          <a href="about.html" class="hover:underline">About</a>
          <a href="#" class="hover:underline">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow">
      <div class="flex flex-wrap gap-2 justify-center mb-8">
        <button class="filter-btn bg-gray-300 px-4 py-2 rounded hover:bg-gray-400" data-filter="all">All</button>
        <button class="filter-btn bg-gray-300 px-4 py-2 rounded hover:bg-gray-400" data-filter="nature">Landscape</button>
        <button class="filter-btn bg-gray-300 px-4 py-2 rounded hover:bg-gray-400" data-filter="architecture">Architecture</button>
        <button class="filter-btn bg-gray-300 px-4 py-2 rounded hover:bg-gray-400" data-filter="portraits">Portraits</button>
      </div>

      <div class="gallery-grid" id="gallery">
        <div class="gallery-item nature">
          <img src="images/pond1.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/pond2.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/pond3.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/trees1.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/trees2.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/trees3.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/trees4.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/flower1.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/flower2.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/flower3.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/flower4.JPG" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/plane1.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/palm.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/sunsethwy6.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/sunsethwy62.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/sunsethwy63.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item nature">
          <img src="images/paintedladiespark.jpg" alt="Landscape" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item architecture">
          <img src="images/downtownbuilding1.jpg" alt="Architecture" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item architecture">
          <img src="images/downtownbuilding2.jpg" alt="Architecture" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item architecture">
          <img src="images/goldengate.jpg" alt="Architecture" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item architecture">
          <img src="images/paintedladiespark2.jpg" alt="Architecture" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item portraits">
          <img src="images/luna.jpg" alt="Portraits" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item portraits">
          <img src="images/luna2.jpg" alt="Portraits" class="w-full aspect-square object-cover shadow">
        </div>
        <div class="gallery-item portraits">
          <img src="images/luna3.jpg" alt="Portraits" class="w-full aspect-square object-cover shadow">
        </div>
      </div>
    </main>

    <footer class="bg-white text-gray-800 text-center py-4 mt-8 border-t">
      <p>All Rights Reserved | Currently under maintenance :) </p>
    </footer>
  </div>

  <script>
    const buttons = document.querySelectorAll('.filter-btn');
    const items = document.querySelectorAll('.gallery-item');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.getAttribute('data-filter');

        items.forEach(item => {
          if (filter === 'all' || item.classList.contains(filter)) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
